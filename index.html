<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="icon" href="data:,">
<title>THE BELOW — Survival Horror</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020303;color:#d8ddd6;font-family:"Courier New",monospace}canvas{display:block}.grain{position:fixed;inset:-40%;pointer-events:none;z-index:20;opacity:.11;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");animation:grain .18s steps(2) infinite}@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(3%,-2%)}50%{transform:translate(-2%,3%)}75%{transform:translate(2%,2%)}}
.vignette{position:fixed;inset:0;z-index:8;pointer-events:none;box-shadow:inset 0 0 160px 55px #000,inset 0 0 28px #000}#blood{position:fixed;inset:0;z-index:9;pointer-events:none;opacity:0;background:radial-gradient(circle,#f40 0,#900 10%,transparent 42%);transition:opacity .2s}
#hud{position:fixed;z-index:12;inset:0;pointer-events:none}.topbar{position:absolute;top:22px;left:24px;right:24px;display:flex;justify-content:space-between;text-shadow:2px 2px 2px #000}.title{font-size:12px;letter-spacing:5px;color:#858a82}.zone{font-size:11px;letter-spacing:3px;color:#bcbfa9}#objective{position:absolute;left:24px;bottom:82px;font-size:12px;letter-spacing:1px;text-shadow:2px 2px 3px #000;max-width:420px;color:#c2c5b8}.label{color:#71766d;font-size:9px;letter-spacing:3px;margin-bottom:7px}#status{position:absolute;left:24px;bottom:26px;display:flex;gap:8px}.chip{border:1px solid rgba(180,190,175,.25);background:rgba(5,8,7,.7);padding:8px 10px;font-size:10px;letter-spacing:1px}.bar{width:70px;height:3px;background:#20231f;margin-top:5px}.fill{height:100%;background:#adb4a2;transition:width .2s}
#cross{position:absolute;left:50%;top:50%;width:8px;height:8px;transform:translate(-50%,-50%);opacity:.45}.#cross:before,.#cross:after{content:"";position:absolute;background:#ddd} .#cross:before{width:8px;height:1px;top:3.5px}.#cross:after{height:8px;width:1px;left:3.5px}
#prompt{position:absolute;left:50%;bottom:130px;transform:translateX(-50%);font-size:11px;letter-spacing:2px;background:rgba(0,0,0,.75);border:1px solid #4a4d45;padding:9px 14px;opacity:0;transition:opacity .15s;white-space:nowrap}
#center{position:fixed;z-index:30;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#111512 0,#040505 65%,#000 100%);text-align:center}.#center.hidden{display:none}.eyebrow{font-size:10px;letter-spacing:7px;color:#777b72;margin-bottom:22px}.mainTitle{font-family:Georgia,serif;font-size:clamp(48px,10vw,112px);letter-spacing:.12em;color:#d0d3c8;text-shadow:0 0 30px #596054}.sub{margin:18px 0 38px;color:#777c72;font-size:11px;letter-spacing:5px}.btn{border:1px solid #777d70;background:rgba(12,15,13,.8);color:#d8dacd;padding:15px 28px;font:11px "Courier New";letter-spacing:4px;cursor:pointer}.btn:hover{background:#d2d5c8;color:#111}.#pauseHint{margin-top:20px;font-size:9px;color:#555a51}.#interaction{position:absolute;left:50%;bottom:170px;text-align:center;transform:translateX(-50%);font-size:10px;letter-spacing:2px;color:#ddd}.#death{display:none}.endTitle{font-family:Georgia,serif;font-size:56px;letter-spacing:8px;color:#9b1d16}.ending{font-size:11px;letter-spacing:3px;line-height:2;color:#a9aaa1}
#touch{display:none;position:fixed;z-index:15;inset:0;pointer-events:none}.stick{position:absolute;left:24px;bottom:28px;width:110px;height:110px;border:1px solid rgba(180,190,175,.15);border-radius:50%;pointer-events:auto}.knob{position:absolute;width:48px;height:48px;border-radius:50%;background:rgba(180,190,175,.12);left:31px;top:31px}.lookZone{position:absolute;right:0;top:0;width:62%;height:75%;pointer-events:auto}.touchBtn{position:absolute;right:22px;bottom:40px;width:68px;height:68px;border:1px solid rgba(180,190,175,.25);border-radius:50%;pointer-events:auto;text-align:center;padding-top:26px;font-size:9px;letter-spacing:1px}@media(pointer:coarse){#touch{display:block}#status{bottom:18px}.topbar{top:12px}.objective{bottom:150px}}
</style>
</head><body>
<div id="game"></div><div class="vignette"></div><div class="grain"></div><div id="blood"></div>
<div id="hud"><div class="topbar"><div class="title">THE BELOW</div><div class="zone" id="zone">SECTOR 01 / ENTRY</div></div><div id="objective"><div class="label">CURRENT OBJECTIVE</div><span id="objectiveText">Find the maintenance key</span></div><div id="status"><div class="chip">HEALTH<div class="bar"><div class="fill" id="health"></div></div></div><div class="chip">BATTERY<div class="bar"><div class="fill" id="battery"></div></div></div><div class="chip" id="itemChip">ITEM — EMPTY</div></div><div id="cross"></div><div id="prompt"></div></div>
<div id="center"><div><div class="eyebrow">BEND HOSPITAL · 1987</div><div class="mainTitle">THE BELOW</div><div class="sub">THE HOSPITAL REMEMBERED YOU</div><button class="btn" id="start">ENTER THE DARK</button><div id="pauseHint">WASD · MOUSE · SHIFT · E · F · ESC</div></div></div>
<div id="death"><div class="endTitle">YOU DIED</div><div class="ending" id="endText">THE DARKNESS TOOK ANOTHER</div><button class="btn" id="restart" style="margin-top:25px">DESCEND AGAIN</button></div>
<div id="touch"><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="lookZone" id="lookZone"></div><div class="touchBtn" id="touchUse">USE</div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const game=document.getElementById('game'),hud=document.getElementById('hud');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x020303);scene.fog=new THREE.FogExp2(0x020303,.038);
const camera=new THREE.PerspectiveCamera(74,innerWidth/innerHeight,.05,90);camera.rotation.order='YXZ';
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;game.appendChild(renderer.domElement);
const clock=new THREE.Clock();let started=false,dead=false,won=false,health=100,battery=100,hasKey=false,hasTape=false,doorOpen=false,generated=false,flash=false,stamina=100,move={w:false,a:false,s:false,d:false};
const colliders=[];const interactables=[];
const mat=(c,rough=1)=>new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:.1});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(38,38),mat(0x151916));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
// walls and a maze
function wall(x,z,w,d,h=3){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(0x252b27));m.position.set(x,h/2,z);m.castShadow=m.receiveShadow=true;scene.add(m);colliders.push({minX:x-w/2,maxX:x+w/2,minZ:z-d/2,maxZ:z+d/2});}
wall(0,-19,38,1);wall(0,19,38,1);wall(-19,0,1,38);wall(19,0,1,38);
const walls=[[-12,-12,14,1],[-12,-5,1,8],[-8,-5,9,1],[-2,-9,1,9],[5,-12,1,9],[9,-8,8,1],[13,-3,1,10],[8,2,11,1],[2,6,1,8],[-4,9,12,1],[-10,13,1,12],[5,12,1,9],[12,14,14,1],[16,7,1,8],[-15,2,1,8],[-15,-2,8,1]];
walls.forEach(v=>wall(v[0],v[1],v[2],v[3]));
// ceiling piping and horror props
const pipeMat=mat(0x31372f,.35);for(let i=-16;i<17;i+=4){const p=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,38,6),pipeMat);p.rotation.z=Math.PI/2;p.position.set(0,2.75,i);scene.add(p)}
for(let i=-16;i<17;i+=8){const light=new THREE.PointLight(0xa5c4b0,0.18,9,2);light.position.set(i,2.65,i%16);light.castShadow=false;scene.add(light);const shade=new THREE.Mesh(new THREE.BoxGeometry(2.2,.08,.35),mat(0x111412));shade.position.set(i,2.62,i%16);scene.add(shade)}
function debris(x,z){for(let i=0;i<5;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(.08+Math.random()*.18,.03,.12+Math.random()*.2),mat(0x30332e));m.position.set(x+(Math.random()-.5)*2,.015,z+(Math.random()-.5)*2);m.rotation.y=Math.random()*6;scene.add(m)}}debris(-5,-2);debris(11,8);debris(-14,14);
// exit door
const door=new THREE.Mesh(new THREE.BoxGeometry(3,3,.25),mat(0x1b211d));door.position.set(17,1.5,17);scene.add(door);const doorLight=new THREE.PointLight(0x596659,0.5,5);doorLight.position.set(17,2.4,16);scene.add(doorLight);interactables.push({mesh:door,type:'door',pos:new THREE.Vector3(17,1.2,17),name:'EXIT'});
// key and tape
const key=new THREE.Mesh(new THREE.TorusGeometry(.18,.055,8,12),mat(0xa09b72,.3));key.position.set(-16,1,-15);key.rotation.x=Math.PI/2;scene.add(key);interactables.push({mesh:key,type:'key',pos:key.position,name:'MAINTENANCE KEY'});
const tape=new THREE.Mesh(new THREE.BoxGeometry(.35,.12,.5),mat(0x111111));tape.position.set(14,.4,12);scene.add(tape);interactables.push({mesh:tape,type:'tape',pos:tape.position,name:'TAPE RECORDER'});
// flashlight
const flashLight=new THREE.SpotLight(0xdfe6d7,2.8,22,Math.PI/7,0.55,1.3);camera.add(flashLight);flashLight.position.set(.12,-.08,.1);flashLight.target.position.set(0,0,-1);camera.add(flashLight.target);scene.add(camera);
// monster
const monster=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.38,1.15,4,8),mat(0x090a09));body.position.y=.95;monster.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.28,12,8),mat(0x11110f));head.position.y=1.95;monster.add(head);const eyeMat=new THREE.MeshBasicMaterial({color:0xc4e2cb});[-.1,.1].forEach(x=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.025,6,6),eyeMat);e.position.set(x,2, -.25);head.add(e)});monster.position.set(15,.02,-14);scene.add(monster);let monsterActive=false;
camera.position.set(-16,.65,-16);camera.rotation.y=.8;
// HUD refs
const obj=document.getElementById('objectiveText'),prompt=document.getElementById('prompt'),blood=document.getElementById('blood');
function updateObjective(){obj.textContent=!hasKey?'Find the maintenance key':(!doorOpen&&!hasTape?'Find a tape — the exit lock needs a signal':'Open the lower exit');document.getElementById('itemChip').textContent=hasKey?'ITEM — KEY':(hasTape?'ITEM — TAPE':'ITEM — EMPTY');}
updateObjective();
// pointer lock
renderer.domElement.addEventListener('click',()=>{if(started&&!dead)renderer.domElement.requestPointerLock?.()});document.getElementById('start').onclick=()=>{document.getElementById('center').style.display='none';started=true;renderer.domElement.requestPointerLock?.();};document.getElementById('restart').onclick=()=>location.reload();
document.addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement&&started&&!dead){camera.rotation.y-=e.movementX*.0022;camera.rotation.x-=e.movementY*.0022;camera.rotation.x=Math.max(-1.45,Math.min(1.45,camera.rotation.x))}});
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['w','a','s','d','shift'].includes(k))move[k]=true;if(k==='e')interact();if(k==='f')toggleFlash()});document.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(['w','a','s','d','shift'].includes(k))move[k]=false});
function toggleFlash(){if(battery>1)flash=!flash}function interact(){for(const o of interactables){if(camera.position.distanceTo(o.pos)<1.7){if(o.type==='key'){hasKey=true;scene.remove(o.mesh);o.done=true;updateObjective()}if(o.type==='tape'){hasTape=true;scene.remove(o.mesh);o.done=true;updateObjective()}if(o.type==='door'){if(hasKey&&hasTape){doorOpen=true;o.done=true;win()}else prompt.textContent=hasKey?'The lock needs a recorded signal':'The lock needs the maintenance key'}}}}
function win(){won=true;dead=true;document.getElementById('center').style.display='flex';document.getElementById('center').innerHTML='<div><div class="eyebrow">SECTOR 01 / COMPLETE</div><div class="mainTitle" style="font-size:58px">ESCAPED</div><div class="sub">THE RECORDING WAS YOUR VOICE</div><button class="btn" onclick="location.reload()">DESCEND AGAIN</button></div>'}
function die(){dead=true;document.exitPointerLock?.();const c=document.getElementById('center');c.style.display='flex';document.querySelector('#center > div').style.display='none';const d=document.getElementById('death');d.style.display='block';c.appendChild(d)}
function collision(nx,nz){if(nx<-18||nx>18||nz<-18||nz>18)return true;for(const c of colliders){if(nx>c.minX-.38&&nx<c.maxX+.38&&nz>c.minZ-.38&&nz<c.maxZ+.38)return true}return false}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(started&&!dead&&!won){const forward=new THREE.Vector3(-Math.sin(camera.rotation.y),0,-Math.cos(camera.rotation.y));const right=new THREE.Vector3(Math.cos(camera.rotation.y),0,-Math.sin(camera.rotation.y));let dx=0,dz=0;if(move.w||touchMove.y<-.15){dx+=forward.x*touchMove.y*-1;dz+=forward.z*touchMove.y*-1}if(move.s){dx-=forward.x;dz-=forward.z}if(move.a){dx-=right.x;dz-=right.z}if(move.d){dx+=right.x;dz+=right.z}const len=Math.hypot(dx,dz);if(len>0){dx/=len;dz/=len;const sprint=move.shift&&stamina>5;const sp=sprint?3.6:2.15;let nx=camera.position.x+dx*sp*dt,nz=camera.position.z+dz*sp*dt;if(!collision(nx,camera.position.z))camera.position.x=nx;if(!collision(camera.position.x,nz))camera.position.z=nz;if(sprint)stamina-=20*dt;else stamina=Math.min(100,stamina+10*dt)}else stamina=Math.min(100,stamina+10*dt);
// monster wakes after key or proximity
if(!monsterActive&&(hasKey||camera.position.distanceTo(monster.position)<7))monsterActive=true;if(monsterActive){const to=camera.position.clone().sub(monster.position);to.y=0;const dist=to.length();if(dist>1.2){to.normalize();const mx=monster.position.x+to.x*(.72+(dist<5?.7:0))*dt,mz=monster.position.z+to.z*(.72+(dist<5?.7:0))*dt;if(!collision(mx,monster.position.z))monster.position.x=mx;if(!collision(monster.position.x,mz))monster.position.z=mz}monster.lookAt(camera.position.x,.8,camera.position.z);if(dist<1.05)die();}
// ambient state
battery-=flash?(.75*dt):(.12*dt);if(battery<=0){battery=0;flash=false}flashLight.intensity=flash&&battery>0?3.1:0;
const danger=camera.position.distanceTo(monster.position);blood.style.opacity=monsterActive&&danger<5?Math.max(.05,(5-danger)*.09):0;document.getElementById('health').style.width=health+'%';document.getElementById('battery').style.width=battery+'%';document.getElementById('zone').textContent=camera.position.z>8?'SECTOR 01 / LOWER':(camera.position.x>8?'SECTOR 01 / EAST':'SECTOR 01 / ENTRY');
let found=null;for(const o of interactables){if(!o.done&&camera.position.distanceTo(o.pos)<1.7)found=o}prompt.style.opacity=found?1:0;if(found)prompt.textContent='[ E ] '+found.name;
// subtle breathing
camera.position.y=.65+Math.sin(clock.elapsedTime*1.7)*.012;
}
renderer.render(scene,camera)}animate();
// touch controls
let touchMove={x:0,y:0},touchId=null;const stick=document.getElementById('stick'),knob=document.getElementById('knob');stick.addEventListener('pointerdown',e=>{touchId=e.pointerId;stick.setPointerCapture(touchId)});stick.addEventListener('pointermove',e=>{if(e.pointerId!==touchId)return;const r=stick.getBoundingRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let x=e.clientX-cx,y=e.clientY-cy,l=Math.hypot(x,y),m=Math.min(l,38);touchMove.x=x/l*m||0;touchMove.y=y/l*m||0;knob.style.transform=`translate(${touchMove.x}px,${touchMove.y}px)`});stick.addEventListener('pointerup',()=>{touchMove={x:0,y:0};knob.style.transform='';touchId=null});
let lookId=null,lastX=0,lastY=0;const look=document.getElementById('lookZone');look.addEventListener('pointerdown',e=>{lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;look.setPointerCapture(lookId)});look.addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;camera.rotation.y-=((e.clientX-lastX)*.004);camera.rotation.x-=((e.clientY-lastY)*.004);camera.rotation.x=Math.max(-1.45,Math.min(1.45,camera.rotation.x));lastX=e.clientX;lastY=e.clientY});look.addEventListener('pointerup',()=>lookId=null);document.getElementById('touchUse').addEventListener('pointerdown',e=>{e.prevent.preventDefault;interact()});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
